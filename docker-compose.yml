services:
  weston:
    image: torizon/weston-imx95:4
    environment:
      - ACCEPT_FSL_EULA=1
    # Required to get udev events from host udevd via netlink
    network_mode: host
    restart: always
    cap_add:
      - CAP_SYS_TTY_CONFIG
    volumes:
      - '/dev:/dev'
      - '/tmp:/tmp'
      - '/run:/run'
      # whole dir, rw: the container runs dos2unix on weston.ini, which fails on a single-file mount
      - './weston:/etc/xdg/weston'
    # Add device access rights through cgroup...
    device_cgroup_rules:
      # ... access to mali
      - c 10:* rmw
      # ... for tty
      - "c 4:* rmw"
      # ... for /dev/input devices
      - "c 13:* rmw"
      # ... for /dev/galcore
      - "c 199:* rmw"
      # ... for /dev/dri devices
      - "c 226:* rmw"
      # ... for /dev/dma_heap device
      - "c 253:* rmw"
      - "c 252:* rmw"
    healthcheck:
      test: ["CMD", "test", "-S", "/tmp/1000-runtime-dir/wayland-0"]
      interval: 5s
      timeout: 4s
      retries: 6
      start_period: 10s

  demo:
    image: lbornia/demo-imx95:latest
    network_mode: host
    privileged: true
    restart: always
    stdin_open: true
    tty: true
    environment:
      - XDG_RUNTIME_DIR=/tmp/1000-runtime-dir
      - WAYLAND_DISPLAY=wayland-0
    volumes:
      - '/dev:/dev'
      - '/tmp:/tmp'
      - '/run:/run'
    device_cgroup_rules:
      # ... access to mali
      - c 10:* rmw
      # ... for tty
      - "c 4:* rmw"
      # ... for /dev/input devices
      - "c 13:* rmw"
      - "c 199:* rmw"
      # ... for /dev/dri devices
      - "c 226:* rmw"
    depends_on:
      weston:
        condition: service_healthy
